name: One-time Compose UI fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Formatth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SurfacePanel and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/formatth/kitaldr/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          old_import = "import androidx.compose.foundation.layout.Column\n"
          new_import = "import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ColumnScope\n"
          if "import androidx.compose.foundation.layout.ColumnScope\n" not in text:
              if old_import not in text:
                  raise SystemExit("Column import not found")
              text = text.replace(old_import, new_import, 1)

          old_signature = "content: @Composable () -> Unit"
          new_signature = "content: @Composable ColumnScope.() -> Unit"
          count = text.count(old_signature)
          if count != 1:
              raise SystemExit(f"Expected exactly one SurfacePanel content signature, found {count}")
          text = text.replace(old_signature, new_signature, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/_fix-compose-surfacepanel.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/formatth/kitaldr/MainActivity.kt .github/workflows/_fix-compose-surfacepanel.yml
          git commit -m "fix(ui): correct Compose SurfacePanel scope"
          git push origin HEAD:main
