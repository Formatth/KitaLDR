name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: FIREBASE_API_KEY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key = os.environ.get("FIREBASE_API_KEY", "").strip()
          if not key:
              raise SystemExit("FIREBASE_API_KEY GitHub Actions secret is not configured")

          path = Path("app/google-services.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          clients = data.get("client", [])
          if not clients or not clients[0].get("api_key"):
              raise SystemExit("No Firebase Android API key entry found in google-services.json")

          clients[0]["api_key"][0]["current_key"] = key
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare direct APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KitaLDR-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitaLDR-debug
          path: KitaLDR-debug.apk
          if-no-files-found: error

      - name: Publish direct APK to debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest \
              --target "$GITHUB_SHA" \
              --title "KitaLDR Debug (Latest)" \
              --notes "Latest successful debug APK from the main branch. This release is automatically updated by GitHub Actions." \
              --prerelease
          fi

          gh release upload debug-latest KitaLDR-debug.apk --clobber
